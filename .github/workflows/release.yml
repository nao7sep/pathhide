name: Release

# Per the app-release-conventions: test -> package -> attach to a DRAFT release.
# CI stays minimal — the .dmg / setup.exe / portable-zip packaging lives in
# scripts/package.sh (macOS) and scripts/package.ps1 (Windows). Nothing is
# published automatically; a draft is created for the pushed tag, verified, then
# published by hand (gh release edit --draft=false).
#
#   - push a tag `v*` -> build both platforms, attach installers + portables to a
#     single draft release for that tag.
#   - manual dispatch -> build only (no release), for a smoke check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default. Only the job that attaches the release needs to write,
# and `test` restores and executes NuGet package code - which should not run
# with a token that can push tags or create releases.
permissions:
  contents: read

jobs:
  # Gate: a failing test suite means no release is built.
  #
  # On BOTH platforms, because the suite is platform-gated. The seven Windows
  # HIDDEN/SYSTEM attribute tests - the core of the Windows product - and the
  # non-macOS branch of the IME test report *skipped* anywhere else, so a
  # macOS-only gate exited 0 while never executing them, and read as coverage.
  test:
    strategy:
      fail-fast: false # see both platforms' results, not just the first failure
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test -c Release

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false # a Windows failure never cancels the macOS build
      matrix:
        include:
          - os: macos-latest
            package: bash scripts/package.sh
          - os: windows-latest
            package: pwsh scripts/package.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # One command per OS — emits the installer + portable into dist/.
      - name: Package (host OS)
        run: ${{ matrix.package }}

      - name: Upload private Windows validation artifacts
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.sha }}
          path: |
            dist/*-setup.exe
            dist/*-win.zip
          if-no-files-found: error
          retention-days: 1

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          # NOT a pre-release. "Pre-release" versus "release" is a subjective
          # label that buys no real latitude — it reads as an excuse rather than a
          # fact — so a 0.x version number carries that signal on its own. The draft
          # flag is what actually protects the release: nothing goes public until it
          # is inspected and published by hand.
          prerelease: false
          fail_on_unmatched_files: true
          # Body renders from the pushed tag (${{ github.ref_name }}), so the note
          # never goes stale on a version bump — no release-specific text baked in.
          body: |
            **PathHide ${{ github.ref_name }}**

            These builds are unsigned, so the OS warns on first launch:
            - **macOS**: right-click the app → **Open** (or `xattr -dr com.apple.quarantine PathHide.app`)
            - **Windows**: SmartScreen → **More info** → **Run anyway**
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*-mac.zip
            dist/*-win.zip
